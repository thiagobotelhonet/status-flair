name: Feature request
description: An idea for something Status Flair could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or annoyance first, before the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you picture it working. A sketch or screenshot of something similar is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds or other extensions you use for this, if any.
